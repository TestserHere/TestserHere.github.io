<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Guess the Year</title>
  <!-- GA4 tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GT4E8Z0EL"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9GT4E8Z0EL');
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
  <link rel="stylesheet" href="../v3tools.css?v=20261121">
  <link rel="stylesheet" href="../v3games.css?v=20261121">
  <link rel="stylesheet" href="year.css">
</head>
<body>
  <main class="app">
    <header class="app-head">
      <a class="back-home" href="../index.html">&lsaquo; Home</a>
      <h1>Guess the Year</h1>
      <p class="note">Read what happened, then pick the year. The closer you are, the more points you get.</p>
    </header>

    <div class="game-bar">
      <span class="round-info" id="round">Round 1 of 5</span>
      <span class="round-info"><strong id="score">0</strong> points</span>
    </div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <article class="event" id="event" hidden>
      <div class="event-art" id="event-art"></div>
      <p class="event-text" id="event-text"></p>
    </article>

    <div class="group year-pick" id="pick" hidden>
      <output class="year-value" id="year-value" for="year">1950</output>
      <input type="range" id="year" min="1000" max="2026" step="1" value="1950" aria-label="Year">
      <div class="year-scale" aria-hidden="true"><span>1000</span><span>1500</span><span id="scale-end">2026</span></div>
      <div class="year-nudge">
        <button type="button" class="secondary" data-nudge="-10">&minus;10</button>
        <button type="button" class="secondary" data-nudge="-1">&minus;1</button>
        <input class="field year-typed" id="typed" type="number" inputmode="numeric" min="1000" max="2026" aria-label="Type the year">
        <button type="button" class="secondary" data-nudge="1">+1</button>
        <button type="button" class="secondary" data-nudge="10">+10</button>
      </div>
      <button type="button" class="primary" id="lock">Lock in</button>
    </div>

    <div class="result-banner" id="result" hidden>
      <h2 id="result-title"></h2>
      <p id="result-text"></p>
      <a class="text-button" id="result-link" target="_blank" rel="noopener">Read about it on Wikipedia</a>
      <button type="button" class="primary" id="next">Next</button>
    </div>

    <div class="result-banner" id="over" hidden>
      <h2 id="over-title"></h2>
      <p id="over-text"></p>
      <ol class="year-recap" id="recap"></ol>
      <button type="button" class="primary" id="again">Play again</button>
    </div>

    <p class="note credits">Events from Wikipedia’s “On this day”, shared under CC BY-SA.</p>
  </main>

  <script src="../v3tools.js?v=20261121"></script>
  <script src="../v3keys.js?v=20261121"></script>
  <script src="year.js"></script>
  <script>window.V3Keys.howTo({"id": "year", "title": "Guess the Year", "steps": ["Read about something that really happened.", "Slide to the year you think it happened, or type it in, then press Lock in.", "Exactly right is 100 points. The further away, the fewer points you get.", "There are five events per game, so the best possible score is 500."]});</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Book Finder</title>
  <!-- GA4 tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GT4E8Z0EL"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9GT4E8Z0EL');
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="../v3tools.css?v=20261121">
  <link rel="stylesheet" href="../v3apps.css?v=20261121">
</head>
<body>
  <main class="app">
    <header class="app-head">
      <a class="back-home" href="../index.html">&lsaquo; Home</a>
      <h1>Book Finder</h1>
      <p class="lede">Find your next read from books you loved.</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Book Finder">
      <button type="button" role="tab" id="tab-find" data-tab="find" aria-controls="panel-find">Find</button>
      <button type="button" role="tab" id="tab-saved" data-tab="saved" aria-controls="panel-saved">Want to read</button>
    </div>

    <section class="panel" id="panel-find" role="tabpanel" aria-labelledby="tab-find">
      <div class="segmented" id="mode" role="group" aria-label="Find books by">
        <button type="button" data-mode="books">Books I liked</button>
        <button type="button" data-mode="subject">A subject</button>
      </div>

      <div class="group" id="books-box">
        <label class="row-label" for="book-search">Add 1 to 3 books you liked</label>
        <ul class="seeds" id="seeds" aria-label="Your books"></ul>
        <div class="search-wrap" id="search-wrap">
          <input class="field" id="book-search" type="search" placeholder="Search by title or author" autocomplete="off" spellcheck="false"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
          <ul class="suggestions" id="suggestions" role="listbox" aria-label="Books" hidden></ul>
        </div>
      </div>

      <div class="group" id="subject-box" hidden>
        <span class="row-label" id="subject-label">Pick a subject</span>
        <div class="chips" id="subjects" role="group" aria-labelledby="subject-label"></div>
        <input class="field" id="subject-other" type="text" placeholder="Or type any subject, like dragons" autocomplete="off" aria-label="Any subject">
      </div>

      <button type="button" class="primary" id="go">Find books</button>

      <section class="results" id="results-area" aria-labelledby="results-title" hidden>
        <div class="section-head">
          <h2 id="results-title">You might like</h2>
          <button type="button" class="text-button" id="more">Show others</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <ol class="items" id="results"></ol>
      </section>
    </section>

    <section class="panel" id="panel-saved" role="tabpanel" aria-labelledby="tab-saved" hidden>
      <ol class="items" id="saved"></ol>
      <div class="empty" id="saved-empty">
        <h2>Your list is empty</h2>
        <p>Tap the bookmark on a book to keep it here.</p>
      </div>
    </section>

    <p class="note credits">Books and covers from Open Library, a free library catalogue by the Internet Archive.</p>
  </main>

  <script src="../v3tools.js?v=20261121"></script>
  <script src="../v3apps.js?v=20261121"></script>
  <script src="book.js"></script>
</body>
</html>

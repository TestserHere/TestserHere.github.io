<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Zones</title>
  <!-- GA4 tracking -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GT4E8Z0EL"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9GT4E8Z0EL');
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟦</text></svg>">
  <link rel="stylesheet" href="../v3tools.css">
  <link rel="stylesheet" href="../v3games.css">
</head>
<body>
  <main class="app">
    <header class="app-head">
      <a class="back-home" href="../index.html">&lsaquo; Home</a>
      <h1>Zones</h1>
    </header>

    <div class="panel">
      <div class="segmented" id="level" role="group" aria-label="Difficulty">
        <button type="button" data-level="easy">Easy 6×6</button>
        <button type="button" data-level="medium">Medium 8×8</button>
        <button type="button" data-level="hard">Hard 10×10</button>
      </div>

      <div class="game-bar">
        <span class="game-time" id="time" role="timer">0:00</span>
        <button type="button" class="text-button" id="new-game">New game</button>
      </div>

      <div class="result-banner" id="win" hidden>
        <h2>Solved!</h2>
        <p id="win-text"></p>
        <button type="button" class="primary" id="win-new">New game</button>
      </div>

      <div class="board-frame">
        <div class="zones" id="board" role="grid" aria-label="Zones board"></div>
      </div>

      <div class="tool-row">
        <button type="button" id="undo">Undo</button>
        <button type="button" id="restart">Restart</button>
        <button type="button" id="hint">Hint</button>
        <button type="button" id="auto" aria-pressed="true">Auto-dots</button>
      </div>

      <div class="group">
        <span class="row-label">How to play</span>
        <ul class="rules">
          <li>Place one marker in every row, column and coloured zone.</li>
          <li>Markers can't touch, not even diagonally.</li>
          <li>Tap once for ×, twice for a marker, three times to clear.</li>
          <li>Every puzzle can be solved without guessing.</li>
        </ul>
      </div>
    </div>
  </main>

  <script src="../v3tools.js"></script>
  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
